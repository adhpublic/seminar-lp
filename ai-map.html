async function loadState() {

async function suggestSubTasks(categoryName, industry, employees) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `あなたは中小企業の業務コンサルタントです。

業種: ${industry}
社員数: ${employees}
業務大項目: ${categoryName}

この大項目に含まれる具体的な業務工程（中項目）を6〜8個提案してください。
JSONのみ出力し、それ以外のテキストは一切含めないでください。

[
  {"name": "<業務工程名（10文字以内）>", "description": "<何をする工程か15文字以内>"},
  ...
]`
        }]
      })
    });
    const d = await res.json();
    const txt = (d.content || []).map(c => c.text || "").join("").replace(/```json|```/g, "").trim();
    return JSON.parse(txt);
  } catch (e) {
    console.error("suggest error", e);
    return null;
  }
}
